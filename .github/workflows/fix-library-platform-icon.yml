name: Fix library platform icon

on:
  push:
    branches: [main]
    paths:
      - platform-icon-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace generic platform icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/biblioteca/page.tsx')
          s = p.read_text()
          old = '''function IconPlatform(props: { className?: string }) {
            return (
              <SvgIcon {...props}>
                <circle cx="12" cy="12" r="8.25" stroke="currentColor" strokeWidth="1.8" />
                <path d="M8.5 10.5H15.5V15H8.5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" />
                <path d="M10 8.5V10.5M14 8.5V10.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
              </SvgIcon>
            );
          }'''
          new = '''function IconPlatform({ platform, className = "h-4 w-4" }: { platform?: string; className?: string }) {
            const normalizedPlatform = normalizeText(platform);

            if (normalizedPlatform === "steam") {
              return (
                <img
                  src="/images/platforms/steam.png"
                  alt="Steam"
                  className={`${className} shrink-0 object-contain`}
                />
              );
            }

            return (
              <SvgIcon className={className}>
                <circle cx="12" cy="12" r="8.25" stroke="currentColor" strokeWidth="1.8" />
                <path d="M8.5 10.5H15.5V15H8.5Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" />
                <path d="M10 8.5V10.5M14 8.5V10.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
              </SvgIcon>
            );
          }'''
          if old not in s:
              raise SystemExit('IconPlatform block not found')
          s = s.replace(old, new, 1)
          old_use = '<IconPlatform className="h-[15px] w-[15px] text-white/65" />'
          new_use = '<IconPlatform platform={platform} className="h-[17px] w-[17px]" />'
          if old_use not in s:
              raise SystemExit('IconPlatform usage not found')
          s = s.replace(old_use, new_use, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/biblioteca/page.tsx
          git rm .github/workflows/fix-library-platform-icon.yml platform-icon-trigger.txt
          git commit -m 'fix: use Steam platform artwork in library'
          git push origin HEAD:main
