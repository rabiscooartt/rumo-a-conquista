name: Fix platform case

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix platform case
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/api/admin/games/route.ts')
          s=p.read_text()
          old='platform: normalizeText(game.platform, "Steam") || "Steam",'
          new='platform: typeof game.platform === "string" ? game.platform.trim() || "Steam" : "Steam",'
          if old not in s:
              raise SystemExit('platform normalization pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/admin/games/route.ts
          git rm .github/workflows/fix-platform-case.yml
          git commit -m 'fix: preserve platform display name'
          git push origin HEAD:main
