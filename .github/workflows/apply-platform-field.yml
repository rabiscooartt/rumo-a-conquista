name: Apply platform field

on:
  push:
    branches: [main]
    paths:
      - platform-update-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch platform support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count))

          p='lib/useSiteGames.ts'
          replace(p, '  cardImage?: string;\n  achievementsList?', '  cardImage?: string;\n  platform?: string;\n  achievementsList?')
          replace(p, '  cardImage: string;\n  emblemTitle?', '  cardImage: string;\n  platform: string;\n  emblemTitle?')
          replace(p, '  card_image: string | null;\n  final_badge:', '  card_image: string | null;\n  platform: string | null;\n  final_badge:')
          replace(p, '  const cardImage =\n    readText(game.cardImage, "") || `/images/games/${finalSlug}/cover.jpg`;\n', '  const cardImage =\n    readText(game.cardImage, "") || `/images/games/${finalSlug}/cover.jpg`;\n\n  const platform = readText(game.platform, "Steam").trim() || "Steam";\n')
          replace(p, '    image,\n    cardImage,\n    achievementsList,', '    image,\n    cardImage,\n    platform,\n    achievementsList,')
          replace(p, '        cardImage: game.card_image ?? "",\n        achievementsList:', '        cardImage: game.card_image ?? "",\n        platform: game.platform ?? "Steam",\n        achievementsList:')
          replace(p, '    cardImage: game.cardImage,\n    finalBadge:', '    cardImage: game.cardImage,\n    platform: game.platform,\n    finalBadge:')
          replace(p, '      cardImage: input.cardImage.trim() || `/images/games/${slug}/cover.jpg`,\n      emblem:', '      cardImage: input.cardImage.trim() || `/images/games/${slug}/cover.jpg`,\n      platform: input.platform.trim() || "Steam",\n      emblem:')

          p='app/api/admin/games/route.ts'
          replace(p, '  cardImage?: string;\n  finalBadge?: unknown;', '  cardImage?: string;\n  platform?: string;\n  finalBadge?: unknown;')
          replace(p, '    card_image: normalizeText(game.cardImage),\n    final_badge:', '    card_image: normalizeText(game.cardImage),\n    platform: normalizeText(game.platform, "Steam") || "Steam",\n    final_badge:')
          replace(p, '      card_image,\n      final_badge,', '      card_image,\n      platform,\n      final_badge,')

          p='app/admin/jogos/page.tsx'
          replace(p, '  cardImage: string;\n  emblemTitle:', '  cardImage: string;\n  platform: string;\n  emblemTitle:')
          replace(p, '  cardImage: "",\n  emblemTitle:', '  cardImage: "",\n  platform: "Steam",\n  emblemTitle:')
          replace(p, '    cardImage: String(game.cardImage || ""),\n    emblemTitle:', '    cardImage: String(game.cardImage || ""),\n    platform: String(game.platform || "Steam"),\n    emblemTitle:')
          replace(p, '      cardImage: String(game.cardImage || ""),\n      emblemTitle:', '      cardImage: String(game.cardImage || ""),\n      platform: String(game.platform || "Steam"),\n      emblemTitle:')
          replace(p, '      cardImage: form.cardImage.trim() || getImagePath(game.slug, "cover.jpg"),\n      emblem:', '      cardImage: form.cardImage.trim() || getImagePath(game.slug, "cover.jpg"),\n      platform: form.platform.trim() || "Steam",\n      emblem:')
          marker='''            <label>\n              <span className="text-[10px] font-black uppercase tracking-[0.2em] text-white/35">\n                Progresso\n              </span>'''
          insert='''            <label>\n              <span className="text-[10px] font-black uppercase tracking-[0.2em] text-white/35">\n                Plataforma\n              </span>\n\n              <select\n                value={form.platform}\n                onChange={(event) =>\n                  setForm((current) => ({\n                    ...current,\n                    platform: event.target.value,\n                  }))\n                }\n                className="mt-2 w-full rounded-xl border border-white/10 bg-black/35 px-4 py-3 text-sm font-bold text-white outline-none focus:border-red-500/40"\n              >\n                {['Steam', 'PlayStation', 'Xbox', 'Nintendo Switch', 'Epic Games', 'GOG', 'Ubisoft Connect', 'EA App'].map((platform) => (\n                  <option key={platform} value={platform}>\n                    {platform}\n                  </option>\n                ))}\n              </select>\n            </label>\n\n'''+marker
          replace(p, marker, insert)
          replace(p, '      cardImage: form.cardImage || `/images/games/${slug}/cover.jpg`,\n      emblemImage:', '      cardImage: form.cardImage || `/images/games/${slug}/cover.jpg`,\n      platform: form.platform || "Steam",\n      emblemImage:')

          Path('supabase/migrations/20260911_add_games_platform.sql').write_text('''-- Plataforma pertence ao jogo (GAMES).\n-- Jogos antigos sem plataforma cadastrada passam a usar Steam como fallback na aplicação.\nalter table public.games\n  add column if not exists platform text;\n\nupdate public.games\nset platform = 'Steam'\nwhere platform is null or btrim(platform) = '';\n''')
          PY

      - name: Commit platform support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/useSiteGames.ts app/api/admin/games/route.ts app/admin/jogos/page.tsx supabase/migrations/20260911_add_games_platform.sql
          git rm .github/workflows/apply-platform-field.yml platform-update-trigger.txt
          git commit -m 'feat: add platform to games'
          git push origin HEAD:main
