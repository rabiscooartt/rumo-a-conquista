<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1800" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#160709"/>
      <stop offset=".44" stop-color="#09090B"/>
      <stop offset="1" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="curtain" x1="820" y1="0" x2="1210" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7D111B"/>
      <stop offset=".48" stop-color="#26080D"/>
      <stop offset="1" stop-color="#100608"/>
    </linearGradient>
    <linearGradient id="gold" x1="890" y1="70" x2="1330" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0B0"/>
      <stop offset=".18" stop-color="#D9A64D"/>
      <stop offset=".42" stop-color="#7C461B"/>
      <stop offset=".62" stop-color="#F0C66C"/>
      <stop offset=".82" stop-color="#774218"/>
      <stop offset="1" stop-color="#E5B75C"/>
    </linearGradient>
    <linearGradient id="cup" x1="1015" y1="88" x2="1195" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE8A0"/>
      <stop offset=".28" stop-color="#A76A28"/>
      <stop offset=".56" stop-color="#F8D37A"/>
      <stop offset=".8" stop-color="#6A3417"/>
      <stop offset="1" stop-color="#D59B44"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050506" stop-opacity=".08"/>
      <stop offset=".38" stop-color="#050506" stop-opacity=".12"/>
      <stop offset=".65" stop-color="#050506" stop-opacity=".22"/>
      <stop offset="1" stop-color="#050506" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0" cy="0" r="1" gradientTransform="matrix(370 0 0 250 1030 206)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B91C2B" stop-opacity=".4"/>
      <stop offset="1" stop-color="#650D18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="matrix(270 0 0 250 1130 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7A93C" stop-opacity=".19"/>
      <stop offset="1" stop-color="#E7A93C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#FFF" fill-opacity=".16"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

